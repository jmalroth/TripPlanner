<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Trips</title>
<link rel="stylesheet" href="styles.css" />
<script src="registry-sync.js"></script>
<script type="module" src="firebase-client.js"></script>
<style>
  /* Auth gate styles */
  .auth-gate { position: fixed; inset: 0; background: var(--bg, #fff); display: none; align-items: center; justify-content: center; z-index: 9999; }
  .auth-gate.show { display: flex; }
  .auth-card { background: var(--panel, #fff); border: 1px solid var(--line, #ddd); border-radius: 10px; padding: 28px 26px; width: min(380px, calc(100vw - 32px)); }
  .auth-card h1 { margin: 0 0 4px; font-size: 22px; }
  .auth-card .sub { color: var(--muted, #888); font-size: 13px; margin-bottom: 18px; }
  .auth-card button.gbtn { width: 100%; padding: 10px; background: var(--accent, #4285f4); color: #fff; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; margin-bottom: 10px; }
  .auth-card .sep { text-align: center; color: var(--muted, #888); font-size: 12px; margin: 10px 0; }
  .auth-card input { width: 100%; padding: 8px 10px; border: 1px solid var(--line, #ddd); border-radius: 6px; font-size: 14px; margin-bottom: 8px; box-sizing: border-box; }
  .auth-card .row-btns { display: flex; gap: 8px; }
  .auth-card .row-btns button { flex: 1; padding: 8px; border: 1px solid var(--line, #ddd); background: var(--panel-2, #f5f5f5); color: var(--text, #111); border-radius: 6px; cursor: pointer; font-size: 13px; }
  .auth-card .row-btns button:hover { background: var(--accent, #4285f4); color: #fff; border-color: var(--accent, #4285f4); }
  .auth-error { color: #b12a48; font-size: 12px; margin-top: 6px; min-height: 16px; }
  .auth-msg { color: #2a8b4a; font-size: 12px; margin-top: 6px; min-height: 16px; }
  .user-chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; background: var(--panel-2, #f5f5f5); border: 1px solid var(--line, #ddd); border-radius: 999px; font-size: 12px; color: var(--muted, #888); }
  .user-chip button { background: none; border: none; color: var(--muted, #888); cursor: pointer; font-size: 12px; padding: 0; }
  .user-chip button:hover { color: var(--text, #000); text-decoration: underline; }
</style>
<style>
  .trips-wrap { max-width: 880px; margin: 0 auto; padding: 24px 20px; }
  .trips-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; gap: 12px; flex-wrap: wrap; }
  .trips-head-actions { display: inline-flex; align-items: center; gap: 12px; }
  .trips-head h1 { margin: 0; font-size: 22px; }
  .trips-section h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 22px 0 8px; }
  .trip-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .trip-card { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .trip-card[data-href] { cursor: pointer; transition: border-color 0.1s, background 0.1s; }
  .trip-card[data-href]:hover { border-color: var(--accent); background: var(--panel-2); }
  .trip-card .trip-name { font-weight: 600; color: var(--text); }
  .trip-meta-line { color: var(--muted); font-size: 13px; }
  .trip-actions { display: flex; gap: 6px; }
  .trip-actions button { background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .trip-actions button:hover { color: var(--text); }
  .trip-actions button.danger:hover { color: #b12a48; border-color: #b12a48; }
  .empty { color: var(--muted); font-style: italic; padding: 8px 0; }
  .new-trip-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; padding: 14px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; }
  .new-trip-form label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 4px; }
  .new-trip-form input { padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; font-size: 14px; }
  .new-trip-form button { padding: 7px 14px; background: var(--accent); color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }

  .view-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .view-toggle button { background: var(--panel); border: none; color: var(--muted); padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .view-toggle button + button { border-left: 1px solid var(--line); }
  .view-toggle button.active { background: var(--accent); color: #fff; }

  .calendar-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
  .cal-month-title { margin: 0 0 10px; font-size: 16px; }
  .cal-empty { color: var(--muted); font-style: italic; padding: 20px; text-align: center; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .cal-dow { background: var(--panel-2); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; padding: 6px 8px; text-align: center; }
  .cal-day { background: var(--panel); min-height: 64px; padding: 4px 0; position: relative; font-size: 12px; }
  .cal-day.other-month { background: var(--panel-2); color: var(--muted); }
  .cal-day.today .cal-day-num { background: var(--accent); color: #fff; border-radius: 50%; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }
  .cal-day-num { display: inline-block; margin: 0 6px; }
  .cal-trip { display: block; margin: 2px 4px 0; padding: 2px 6px; color: #fff; font-size: 11px; border-radius: 3px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none; }
  .cal-trip:hover { filter: brightness(1.1); }
  /* Bars that continue from the previous cell extend left to bridge the
     grid gap and cell padding, and drop their left rounding. */
  .cal-trip.continued { margin-left: -1px; padding-left: 11px; border-top-left-radius: 0; border-bottom-left-radius: 0; }
  /* Bars that continue into the next cell do the same on the right. */
  .cal-trip.continues { margin-right: -1px; padding-right: 11px; border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .cal-trip.bg-indigo  { background: #6c8cff; }
  .cal-trip.bg-teal    { background: #2dd4bf; }
  .cal-trip.bg-amber   { background: #f59e0b; }
  .cal-trip.bg-rose    { background: #fb7185; }
  .cal-trip.bg-emerald { background: #34d399; }
  .cal-trip.bg-violet  { background: #a78bfa; }
  .cal-trip.bg-grey    { background: #b9bec7; }
  .cal-trip.bg-accent  { background: var(--accent); }
  .cal-trip.cal-spacer { background: transparent; pointer-events: none; }
</style>
</head>
<body>
  <div id="auth-gate" class="auth-gate">
    <div class="auth-card">
      <h1>Sign in</h1>
      <div class="sub">Sign in to view and edit your trips.</div>
      <button class="gbtn" id="auth-google">Continue with Google</button>
      <div class="sep">— or —</div>
      <input id="auth-email" type="email" placeholder="you@example.com" autocomplete="email" />
      <input id="auth-password" type="password" placeholder="Password (optional)" autocomplete="current-password" />
      <div class="row-btns">
        <button id="auth-signin">Sign in</button>
        <button id="auth-signup">Create account</button>
        <button id="auth-magic">Email me a link</button>
      </div>
      <div class="auth-error" id="auth-error"></div>
      <div class="auth-msg" id="auth-msg"></div>
    </div>
  </div>

  <div class="trips-wrap" id="trips-wrap" hidden>
    <div class="trips-head">
      <h1>Trips</h1>
      <div class="trips-head-actions">
        <div class="view-toggle" id="view-toggle">
          <button data-view="list" class="active">List</button>
          <button data-view="calendar">Calendar</button>
        </div>
        <span class="user-chip" id="user-chip" hidden>
          <span id="user-chip-name"></span>
          <button id="user-set-password" title="Set or change your password">Set password</button>
          <button id="user-signout">Sign out</button>
        </span>
      </div>
    </div>

    <form id="new-trip-form" class="new-trip-form">
      <label>Name<input id="nt-name" type="text" placeholder="e.g. Iceland 2027" required /></label>
      <label>Start<input id="nt-start" type="date" /></label>
      <label>End<input id="nt-end" type="date" /></label>
      <button type="submit">+ New trip</button>
    </form>

    <div id="list-view">
      <section class="trips-section" id="needs-label-section" hidden>
        <h2>New invitations</h2>
        <ul id="needs-label-list" class="trip-list"></ul>
      </section>

      <section class="trips-section">
        <h2>Upcoming &amp; current</h2>
        <ul id="upcoming-list" class="trip-list"></ul>
      </section>

      <section class="trips-section">
        <h2>Past</h2>
        <ul id="past-list" class="trip-list"></ul>
      </section>

      <section class="trips-section" id="watching-section" hidden>
        <h2 style="display:inline-flex;align-items:center;gap:8px;">
          Watching
          <label style="font-size:11px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:normal;cursor:pointer;display:inline-flex;align-items:center;gap:4px;">
            color
            <input type="color" id="watching-color" value="#fffae0" style="width:24px;height:18px;padding:0;border:1px solid var(--line);border-radius:4px;cursor:pointer;" />
          </label>
        </h2>
        <ul id="watching-list" class="trip-list"></ul>
      </section>
    </div>

    <div id="calendar-view" hidden>
      <div id="calendar-months"></div>
    </div>
  </div>

<script>
// --- Auth gate ----------------------------------------------------------
// Wait for window.fb (from firebase-client.js, loaded as a module) and gate
// the trips UI behind sign-in. The existing localStorage trip code below
// keeps running for now — Firestore data sync comes in a follow-up pass.
(function setupAuthGate() {
  const gate = document.getElementById("auth-gate");
  const wrap = document.getElementById("trips-wrap");
  const chip = document.getElementById("user-chip");
  const chipName = document.getElementById("user-chip-name");
  const err = document.getElementById("auth-error");
  const msg = document.getElementById("auth-msg");
  const setErr = (t) => { err.textContent = t || ""; msg.textContent = ""; };
  const setMsg = (t) => { msg.textContent = t || ""; err.textContent = ""; };

  // window.fb is exported by firebase-client.js once the module finishes
  // loading. Poll briefly until it's available.
  function whenReady(cb) {
    if (window.fb) return cb();
    const iv = setInterval(() => {
      if (window.fb) { clearInterval(iv); cb(); }
    }, 30);
  }

  whenReady(() => {
    const setPwBtn = document.getElementById("user-set-password");
    window.fb.onAuth(async (user) => {
      if (user) {
        gate.classList.remove("show");
        wrap.hidden = false;
        chip.hidden = false;
        chipName.textContent = user.displayName || user.email || "Signed in";
        // Hide "Set password" if the user has already chosen one.
        setPwBtn.hidden = true;
        try {
          const has = await window.fb.hasPassword();
          setPwBtn.hidden = has;
        } catch (_) { /* leave hidden on failure */ }
      } else {
        gate.classList.add("show");
        wrap.hidden = true;
        chip.hidden = true;
      }
    });

    document.getElementById("auth-google").addEventListener("click", async () => {
      setErr("");
      try { await window.fb.signInGoogle(); }
      catch (e) { setErr(e.message || "Google sign-in failed"); }
    });

    document.getElementById("auth-signin").addEventListener("click", async () => {
      const email = document.getElementById("auth-email").value.trim();
      const pw = document.getElementById("auth-password").value;
      if (!email || !pw) { setErr("Email and password required"); return; }
      try { await window.fb.signInPassword(email, pw); }
      catch (e) { setErr(e.message || "Sign-in failed"); }
    });

    document.getElementById("auth-signup").addEventListener("click", async () => {
      const email = document.getElementById("auth-email").value.trim();
      const pw = document.getElementById("auth-password").value;
      if (!email || !pw) { setErr("Email and password required"); return; }
      if (pw.length < 6) { setErr("Password must be at least 6 characters"); return; }
      try { await window.fb.signUpPassword(email, pw); }
      catch (e) { setErr(e.message || "Sign-up failed"); }
    });

    document.getElementById("auth-magic").addEventListener("click", async () => {
      const email = document.getElementById("auth-email").value.trim();
      if (!email) { setErr("Email required for magic link"); return; }
      try {
        await window.fb.sendMagicLink(email);
        setMsg("Check your email — click the link to sign in.");
      } catch (e) { setErr(e.message || "Couldn't send link"); }
    });

    document.getElementById("user-signout").addEventListener("click", async () => {
      try { await window.fb.signOut(); }
      catch (e) { /* ignore */ }
    });

    document.getElementById("user-set-password").addEventListener("click", async () => {
      const pw = prompt("Set a new password (min 6 characters). You'll be able to sign in with email + password going forward.");
      if (pw == null) return;
      try {
        await window.fb.setPassword(pw);
        alert("Password updated. Use 'Sign in' with your email + this password next time.");
        document.getElementById("user-set-password").hidden = true;
      } catch (e) {
        // Firebase requires a recent sign-in for password changes; if so it
        // throws auth/requires-recent-login. The user has to sign out and
        // back in to refresh.
        if (/requires-recent-login/.test(e.code || e.message || "")) {
          alert("For security, sign out and sign back in (via your email link), then try Set password again.");
        } else {
          alert(e.message || "Couldn't set password.");
        }
      }
    });
  });
})();

const REGISTRY_KEY = "trip-builder-trips";
const TRIP_KEY_PREFIX = "trip-builder-trip-";
const LEGACY_KEY = "trip-builder-v7";

// In-memory mirror of the user's trips, fed live by window.fb.subscribeMyTrips.
// Shape: [{ id, slug, name, start, end, events?, _role, ownerId, sharedWith }]
let FS_TRIPS = [];
let FS_TRIPS_READY = false;
// Per-user labels on shared trips: { slug: "traveling" | "watching" }.
let FS_LABELS = {};
// Per-user watching-cards background color.
let FS_WATCHING_COLOR = null;

function readRegistry() {
  // Always reflects the signed-in user's Firestore data. No localStorage
  // fallback — that would leak the previous user's trips on shared devices.
  return FS_TRIPS;
}
function writeRegistry(list) {
  // Kept only for the legacy + bookend-cleanup migrations below. New code
  // writes via window.fb.saveTrip / deleteTrip directly.
  localStorage.setItem(REGISTRY_KEY, JSON.stringify(list));
}
function newTripId() {
  return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

// Slugify a name into a URL-safe identifier ("Africa Safari 2026" → "africa-safari-2026").
function slugify(name) {
  return (name || "trip")
    .toLowerCase()
    .normalize("NFKD").replace(/[̀-ͯ]/g, "")  // strip accents
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "")
    .slice(0, 40) || "trip";
}
function uniqueSlug(name, existingSlugs) {
  const base = slugify(name);
  if (!existingSlugs.has(base)) return base;
  let i = 2;
  while (existingSlugs.has(`${base}-${i}`)) i++;
  return `${base}-${i}`;
}
function ensureAllSlugs() {
  const list = readRegistry();
  let changed = false;
  const used = new Set(list.map(t => t.slug).filter(Boolean));
  for (const t of list) {
    if (!t.slug) {
      t.slug = uniqueSlug(t.name, used);
      used.add(t.slug);
      changed = true;
    }
  }
  if (changed) writeRegistry(list);
}
function tripUrl(t) {
  return `trip.html?id=${encodeURIComponent(t.slug || t.id)}`;
}

// One-time cleanup: drop location-lane events that fall entirely before the
// first flight or entirely after the last flight (the "you are at home"
// bookend cities like Vancouver/Seattle from the original Zanzibar seed).
const BOOKEND_CLEANUP_KEY = "trip-builder-bookend-cleanup-v1";
function cleanupBookendsOnce() {
  if (localStorage.getItem(BOOKEND_CLEANUP_KEY)) return;
  const list = readRegistry();
  for (const t of list) {
    try {
      const raw = localStorage.getItem(TRIP_KEY_PREFIX + t.id);
      if (!raw) continue;
      const blob = JSON.parse(raw);
      if (!Array.isArray(blob.events) || blob.events.length === 0) continue;
      const flights = blob.events.filter(e =>
        e.lane === "flights" && !(e.title || "").endsWith("layover"));
      if (flights.length === 0) continue;
      const firstStart = flights.reduce((a, e) => e.start < a ? e.start : a, flights[0].start);
      const lastEnd    = flights.reduce((a, e) => e.end   > a ? e.end   : a, flights[0].end);
      blob.events = blob.events.filter(e => {
        if (e.lane !== "location") return true;
        // A bookend "starting city" ends on or before the first flight's
        // departure day; a "ending city" starts on or after the last
        // flight's arrival day.
        if (e.end   <= firstStart) return false;
        if (e.start >= lastEnd)    return false;
        return true;
      });
      localStorage.setItem(TRIP_KEY_PREFIX + t.id, JSON.stringify(blob));
    } catch (e) { /* ignore */ }
  }
  localStorage.setItem(BOOKEND_CLEANUP_KEY, "1");
}

// Migrate any legacy single-trip blob on first visit so it shows up in the list.
(function migrateLegacy() {
  const legacy = localStorage.getItem(LEGACY_KEY);
  if (!legacy) return;
  try {
    const parsed = JSON.parse(legacy);
    const id = newTripId();
    localStorage.setItem(TRIP_KEY_PREFIX + id, legacy);
    const list = readRegistry();
    const used = new Set(list.map(t => t.slug).filter(Boolean));
    list.push({
      id,
      slug: uniqueSlug(parsed.name || "Untitled trip", used),
      name: parsed.name || "Untitled trip",
      start: parsed.start || null,
      end: parsed.end || null,
    });
    writeRegistry(list);
    localStorage.removeItem(LEGACY_KEY);
  } catch (e) { /* ignore */ }
})();

function fmtRange(t) {
  if (!t.start && !t.end) return "No dates set";
  if (t.start && t.end) return `${t.start} → ${t.end}`;
  return t.start || t.end;
}

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

const ARCHIVE_SLUG = "archive";
function isArchive(t) {
  return t.slug === ARCHIVE_SLUG;
}

function isPast(t) {
  return t.end && t.end < todayStr();
}

function render() {
  const list = readRegistry().filter(t => !isArchive(t));

  // Bucket trips by role + label:
  //   own trips (owner/editor): mixed into upcoming/past
  //   shared trips with no label yet: needs-label section
  //   shared trips labeled "traveling": mixed into upcoming/past
  //   shared trips labeled "watching": watching section
  const own = list.filter(t => t._role === "owner" || t._role === "editor");
  const sharedAll = list.filter(t => t._role === "viewer" || t._role === "viewer-pricing");
  const needsLabel = sharedAll.filter(t => !FS_LABELS[t.slug || t.id]);
  const traveling = sharedAll.filter(t => FS_LABELS[t.slug || t.id] === "traveling");
  const watching = sharedAll.filter(t => FS_LABELS[t.slug || t.id] === "watching");

  const visible = [...own, ...traveling];
  const upcoming = visible.filter(t => !isPast(t));
  const past = visible.filter(t => isPast(t));

  const ulNeeds = document.getElementById("needs-label-list");
  const ul1 = document.getElementById("upcoming-list");
  const ul2 = document.getElementById("past-list");
  const ulWatching = document.getElementById("watching-list");
  ulNeeds.innerHTML = "";
  ul1.innerHTML = "";
  ul2.innerHTML = "";
  ulWatching.innerHTML = "";
  document.getElementById("needs-label-section").hidden = needsLabel.length === 0;
  document.getElementById("watching-section").hidden = watching.length === 0;

  function row(t) {
    const li = document.createElement("li");
    li.className = "trip-card";
    li.dataset.href = tripUrl(t);
    const isShared = t._role !== "owner" && t._role !== "editor";
    const isOwn = t._role === "owner";
    const slug = t.slug || t.id;
    const label = FS_LABELS[slug] || null;
    const actions = isOwn
      ? `<button data-action="rename">Rename</button>
         <button data-action="delete" class="danger">Delete</button>`
      : isShared
        ? `<button data-action="toggle-label" title="Move between Traveling and Watching">
             ${label === "watching" ? "I'm going" : "Just watching"}
           </button>`
        : `<button data-action="leave" class="danger" title="Remove from my list">Hide</button>`;
    li.innerHTML = `
      <div>
        <span class="trip-name"></span>
        <span class="trip-role-badge" style="margin-left:6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;"></span>
        <div class="trip-meta-line"></div>
      </div>
      <div class="trip-actions">${actions}</div>
    `;
    li.querySelector(".trip-name").textContent = t.name || "Untitled trip";
    const badge = li.querySelector(".trip-role-badge");
    if (isShared) badge.textContent = label === "watching" ? "Watching" : (label === "traveling" ? "Shared with me" : "Invited");
    else if (t._role === "editor") badge.textContent = "Editor";
    li.querySelector(".trip-meta-line").textContent = fmtRange(t);
    li.addEventListener("click", (e) => {
      if (e.target.closest("button")) return;
      window.location.href = li.dataset.href;
    });
    li.querySelector('[data-action="rename"]')?.addEventListener("click", async () => {
      if (t._role !== "owner") { alert("You can only rename trips you own."); return; }
      const next = prompt("Rename trip:", t.name || "");
      if (next == null) return;
      const name = next.trim();
      if (!name) return;
      const res = await window.fb.saveTrip(slug, { name });
      if (!res.ok) alert(`Rename failed: ${res.error || res.status}`);
      // No render() call — the subscribeMyTrips listener fires automatically.
    });

    li.querySelector('[data-action="toggle-label"]')?.addEventListener("click", async (e) => {
      e.stopPropagation();
      const next = label === "watching" ? "traveling" : "watching";
      try { await window.fb.setTripLabel(slug, next); }
      catch (err) { alert(err.message || "Couldn't update label"); }
    });
    li.querySelector('[data-action="delete"]')?.addEventListener("click", async () => {
      if (t._role !== "owner") { alert("You can only delete trips you own."); return; }
      if (!confirm(`Delete "${t.name}"? This can't be undone.`)) return;
      const res = await window.fb.deleteTrip(slug);
      if (!res.ok) alert(`Delete failed: ${res.error || res.status}`);
    });
    return li;
  }

  if (upcoming.length === 0) ul1.innerHTML = '<li class="empty">No upcoming trips yet — create one above.</li>';
  else upcoming.forEach(t => ul1.appendChild(row(t)));

  if (past.length === 0) ul2.innerHTML = '<li class="empty">No past trips.</li>';
  else past.forEach(t => ul2.appendChild(row(t)));

  watching.forEach(t => {
    const li = row(t);
    if (FS_WATCHING_COLOR) li.style.background = FS_WATCHING_COLOR;
    ulWatching.appendChild(li);
  });

  // Build the "you've been invited — traveling or watching?" rows.
  for (const t of needsLabel) {
    const slug = t.slug || t.id;
    const li = document.createElement("li");
    li.className = "trip-card";
    li.dataset.href = tripUrl(t);
    li.innerHTML = `
      <div>
        <span class="trip-name"></span>
        <div class="trip-meta-line"></div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px;">Choose how this trip should appear in your list:</div>
      </div>
      <div class="trip-actions">
        <button data-pick="traveling">I'm going</button>
        <button data-pick="watching">Just watching</button>
      </div>
    `;
    li.querySelector(".trip-name").textContent = t.name || "Untitled trip";
    li.querySelector(".trip-meta-line").textContent = fmtRange(t);
    li.addEventListener("click", (e) => {
      if (e.target.closest("button")) return;
      window.location.href = li.dataset.href;
    });
    li.querySelectorAll('button[data-pick]').forEach(btn => {
      btn.addEventListener("click", async (e) => {
        e.stopPropagation();
        try { await window.fb.setTripLabel(slug, btn.dataset.pick); }
        catch (err) { alert(err.message || "Couldn't save choice"); }
      });
    });
    ulNeeds.appendChild(li);
  }
}

// --- calendar view ---

const VIEW_KEY = "trip-builder-trips-view";

let currentView = localStorage.getItem(VIEW_KEY) || "list";

function parseISO(s) {
  if (!s) return null;
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function fmtISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}
function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function setView(v) {
  currentView = v;
  localStorage.setItem(VIEW_KEY, v);
  document.querySelectorAll("#view-toggle button").forEach(b => {
    b.classList.toggle("active", b.dataset.view === v);
  });
  document.getElementById("list-view").hidden = v !== "list";
  document.getElementById("calendar-view").hidden = v !== "calendar";
  if (v === "calendar") renderCalendar();
}

function readTripBlob(id) {
  // For calendar rendering: the live Firestore trip docs already include the
  // events array (we copy them into FS_TRIPS), so look there first.
  const t = FS_TRIPS.find(x => x.id === id || x.slug === id);
  if (t) return t;
  try { return JSON.parse(localStorage.getItem(TRIP_KEY_PREFIX + id) || "null"); }
  catch (e) { return null; }
}

function renderCalendar() {
  const trips = readRegistry().filter(t => t.start && t.end && !isArchive(t));
  const container = document.getElementById("calendar-months");
  container.innerHTML = "";

  if (trips.length === 0) {
    const empty = document.createElement("div");
    empty.className = "cal-empty";
    empty.textContent = "No trips with dates yet — create one to see it on the calendar.";
    container.appendChild(empty);
    return;
  }

  // Pre-load each trip's location-lane events so we can label calendar cells
  // with the actual place names from the timeline view. Pack flights into
  // stable rows so a multi-leg trip keeps each leg on its own row across all
  // days (e.g. FRA-ZNZ stays on row 1 on days 18 and 19 instead of jumping
  // up to row 0 once YVR-FRA ends).
  const tripLocations = {};
  const tripFlights = {};
  trips.forEach(t => {
    const blob = readTripBlob(t.id);
    const events = blob?.events || [];
    tripLocations[t.id] = events.filter(e => e.lane === "location");
    const flights = events.filter(e =>
      e.lane === "flights" && !(e.title || "").endsWith("layover"));
    tripFlights[t.id] = packFlightsIntoRows(flights);
  });

  const monthSet = new Set();
  trips.forEach(t => {
    const s = parseISO(t.start);
    const e = parseISO(t.end);
    let cur = new Date(s.getFullYear(), s.getMonth(), 1);
    const last = new Date(e.getFullYear(), e.getMonth(), 1);
    while (cur <= last) {
      monthSet.add(`${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, "0")}`);
      cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
    }
  });

  const months = [...monthSet].sort().map(s => {
    const [y, m] = s.split("-").map(Number);
    return new Date(y, m - 1, 1);
  });

  months.forEach(monthDate => container.appendChild(renderMonth(monthDate, trips, tripLocations, tripFlights)));
}

// Assign each flight a stable row index so a flight stays on the same row
// across every day it touches (and other rows are blank-padded as needed).
function packFlightsIntoRows(flights) {
  const sorted = [...flights].sort((a, b) => {
    if (a.start !== b.start) return a.start.localeCompare(b.start);
    return (a.startTime || "00:00").localeCompare(b.startTime || "00:00");
  });
  const rowEnds = []; // last end-date per row
  return sorted.map(f => {
    let row = 0;
    while (row < rowEnds.length && rowEnds[row] >= f.start) row++;
    rowEnds[row] = f.end;
    return { ...f, _row: row };
  });
}

// Pull "YVR" / "ZNZ" airport codes out of a flight title like "LH493 YVR → FRA".
function extractFlightCodes(title) {
  if (!title) return null;
  const m = title.match(/\b([A-Z]{3})\s*(?:→|->|-|–)\s*([A-Z]{3})\b/);
  return m ? { from: m[1], to: m[2] } : null;
}

// Group flights into chains where each next flight starts on or before the
// previous chain's last leg ends (a connection on the same day).
function chainFlights(flights) {
  if (!flights.length) return [];
  const sorted = [...flights].sort((a, b) => {
    if (a.start !== b.start) return a.start.localeCompare(b.start);
    return (a.startTime || "00:00").localeCompare(b.startTime || "00:00");
  });
  const chains = [];
  let cur = null;
  for (const f of sorted) {
    if (!cur) { cur = { flights: [f], start: f.start, end: f.end, color: f.color }; continue; }
    if (f.start <= cur.end) {
      cur.flights.push(f);
      if (f.end > cur.end) cur.end = f.end;
    } else {
      chains.push(cur);
      cur = { flights: [f], start: f.start, end: f.end, color: f.color };
    }
  }
  if (cur) chains.push(cur);
  for (const c of chains) {
    const codes = c.flights.map(f => extractFlightCodes(f.title)).filter(Boolean);
    if (codes.length) {
      c.from = codes[0].from;
      c.to = codes[codes.length - 1].to;
      const stops = [codes[0].from];
      codes.forEach(co => { if (stops[stops.length - 1] !== co.to) stops.push(co.to); });
      c.label = stops.length === 2 ? `${stops[0]}–${stops[1]}` : `${c.from}–${c.to}`;
      c.tooltip = stops.join(" → ");
    } else {
      c.label = c.flights[0].title || "Flight";
      c.tooltip = c.flights.map(f => f.title).join(" · ");
    }
  }
  return chains;
}

const KNOWN_COLORS = new Set(["indigo","teal","amber","rose","emerald","violet","grey"]);
function colorClass(c) {
  return KNOWN_COLORS.has(c) ? `bg-${c}` : "bg-accent";
}

function renderMonth(monthDate, trips, tripLocations, tripFlights) {
  const year = monthDate.getFullYear();
  const month = monthDate.getMonth();
  const today = new Date();

  const wrap = document.createElement("div");
  wrap.className = "calendar-wrap";
  const title = document.createElement("h3");
  title.className = "cal-month-title";
  title.textContent = monthDate.toLocaleString(undefined, { month: "long", year: "numeric" });
  wrap.appendChild(title);

  const grid = document.createElement("div");
  grid.className = "cal-grid";

  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(d => {
    const h = document.createElement("div");
    h.className = "cal-dow";
    h.textContent = d;
    grid.appendChild(h);
  });

  const firstOfMonth = new Date(year, month, 1);
  const gridStart = addDays(firstOfMonth, -firstOfMonth.getDay());

  for (let i = 0; i < 42; i++) {
    const day = addDays(gridStart, i);
    const cell = document.createElement("div");
    cell.className = "cal-day";
    if (day.getMonth() !== month) cell.classList.add("other-month");
    if (sameDay(day, today)) cell.classList.add("today");

    const num = document.createElement("span");
    num.className = "cal-day-num";
    num.textContent = day.getDate();
    cell.appendChild(num);

    const dayISO = fmtISO(day);
    const dow = day.getDay();
    trips.forEach(t => {
      if (dayISO < t.start || dayISO > t.end) return;
      const isWeekStart = dow === 0;
      const locs = (tripLocations[t.id] || []).filter(e => dayISO >= e.start && dayISO <= e.end);
      const flightsToday = (tripFlights[t.id] || []).filter(e => dayISO >= e.start && dayISO <= e.end);

      // Preferred labels in order: flights that touch this day rendered at
      // their stable row index (with empty-row spacers so a flight stays in
      // the same vertical position across all its days), then "Where"
      // events, then a trip-name fallback so the trip is still visible on
      // bare days.
      let items;
      if (flightsToday.length > 0) {
        const maxRow = Math.max(...flightsToday.map(e => e._row || 0));
        items = [];
        for (let r = 0; r <= maxRow; r++) {
          const f = flightsToday.find(e => (e._row || 0) === r);
          if (f) {
            const codes = extractFlightCodes(f.title);
            const label = codes ? `${codes.from}–${codes.to}` : (f.title || "Flight");
            items.push({
              label,
              start: f.start,
              end: f.end,
              color: f.color || "indigo",
              href: tripUrl(t),
              tooltip: `${f.title} — ${t.name}`,
            });
          } else {
            items.push({ _spacer: true });
          }
        }
      } else if (locs.length > 0) {
        items = locs.map(e => ({
          label: e.title,
          start: e.start,
          end: e.end,
          color: e.color || "violet",
          href: tripUrl(t),
          tooltip: `${e.title} — ${t.name} (${e.start}${e.end !== e.start ? ` → ${e.end}` : ""})`,
        }));
      } else {
        items = [{
          label: t.name || "Untitled",
          start: t.start,
          end: t.end,
          color: "accent",
          href: tripUrl(t),
          tooltip: `${t.name || "Untitled"} (${t.start} → ${t.end})`,
        }];
      }

      items.forEach(item => {
        if (item._spacer) {
          // Reserve vertical slot so the flight below stays at its row.
          const sp = document.createElement("div");
          sp.className = "cal-trip cal-spacer";
          cell.appendChild(sp);
          return;
        }
        const bar = document.createElement("a");
        bar.className = `cal-trip ${colorClass(item.color)}`;
        bar.href = item.href;
        bar.textContent = item.label;
        bar.title = item.tooltip;
        if (dayISO !== item.start && !isWeekStart) bar.classList.add("continued");
        if (dayISO !== item.end && dow !== 6) bar.classList.add("continues");
        cell.appendChild(bar);
      });
    });

    grid.appendChild(cell);
  }

  wrap.appendChild(grid);
  return wrap;
}

document.getElementById("view-toggle").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-view]");
  if (!btn) return;
  setView(btn.dataset.view);
});
document.getElementById("new-trip-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = document.getElementById("nt-name").value.trim();
  const start = document.getElementById("nt-start").value || null;
  const end = document.getElementById("nt-end").value || null;
  if (!name) return;
  const list = readRegistry();
  const slug = uniqueSlug(name, new Set(list.map(t => t.slug).filter(Boolean)));
  const id = newTripId();
  const blob = {
    name, start, end,
    tzAware: true,
    events: [],
    options: [],
    activeView: "main",
    shrunkDays: [],
  };
  const res = await window.fb.saveTrip(slug, blob);
  if (!res.ok) { alert(`Create failed: ${res.error || res.status}`); return; }
  // Mirror to localStorage so the editor opens immediately (the editor will
  // also hit Firestore once we refactor it).
  localStorage.setItem(TRIP_KEY_PREFIX + id, JSON.stringify(blob));
  window.location.href = tripUrl({ slug });
});

document.getElementById("watching-color")?.addEventListener("change", async (e) => {
  const color = e.target.value;
  try { await window.fb.setWatchingColor(color); }
  catch (err) { alert(err.message || "Couldn't save color"); }
});

ensureAllSlugs();
cleanupBookendsOnce();
setView(currentView);

// Subscribe to Firestore once signed in — every trip / label / profile change re-renders.
let _unsubTrips = null;
let _unsubLabels = null;
let _unsubProfile = null;
(function setupTripsSubscription() {
  function whenFb(cb) {
    if (window.fb) return cb();
    const iv = setInterval(() => { if (window.fb) { clearInterval(iv); cb(); } }, 30);
  }
  whenFb(() => {
    window.fb.onAuth((user) => {
      if (_unsubTrips) { _unsubTrips(); _unsubTrips = null; }
      if (_unsubLabels) { _unsubLabels(); _unsubLabels = null; }
      if (_unsubProfile) { _unsubProfile(); _unsubProfile = null; }
      if (!user) { FS_TRIPS = []; FS_LABELS = {}; FS_WATCHING_COLOR = null; render(); return; }
      _unsubTrips = window.fb.subscribeMyTrips((trips) => {
        FS_TRIPS = trips;
        render();
        if (currentView === "calendar") renderCalendar();
      });
      _unsubLabels = window.fb.subscribeMyTripLabels((labels) => {
        FS_LABELS = labels;
        render();
      });
      _unsubProfile = window.fb.subscribeMyProfile((profile) => {
        FS_WATCHING_COLOR = profile.watchingColor || null;
        const picker = document.getElementById("watching-color");
        if (picker && FS_WATCHING_COLOR) picker.value = FS_WATCHING_COLOR;
        render();
      });
    });
  });
})();

// Disabled — was a remnant of the old worker-backed registry sync.
(async function syncRegistryOnLoad() {
  if (false && window.RegistrySync) {
    const res = await window.RegistrySync.pullAndMerge();
    if (res?.changed) {
      render();
      if (currentView === "calendar") renderCalendar();
    }
  }
})();
</script>
