name = "trip-snapshots"
main = "worker.js"
compatibility_date = "2026-01-01"

# After running `wrangler kv namespace create SNAPSHOTS`, paste the printed
# id below (replace the placeholder). The "binding" name must stay SNAPSHOTS
# so the worker code can reference env.SNAPSHOTS.
[[kv_namespaces]]
binding = "SNAPSHOTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
